                        <path fill-rule="evenodd" clip-rule="evenodd" d="M13.4644 5.12169C15.417 3.16907 18.5829 3.16907 20.5355 5.12169L20.8786 5.46484C22.8313 7.41746 22.8313 10.5833 20.8786 12.5359L17.5355 15.8791C15.5829 17.8317 12.417 17.8317 10.4644 15.879L10.1213 15.5359C9.30499 14.7196 8.82903 13.6887 8.69574 12.6247C8.62709 12.0767 9.01569 11.5768 9.56369 11.5081C10.1117 11.4395 10.6116 11.8281 10.6802 12.3761C10.7602 13.0146 11.0445 13.6307 11.5355 14.1217L11.8786 14.4648C13.0502 15.6364 14.9497 15.6364 16.1213 14.4648L19.4644 11.1217C20.636 9.95012 20.636 8.05062 19.4644 6.87905L19.1213 6.53591C17.9497 5.36436 16.0503 5.36433 14.8787 6.53581C14.8787 6.53584 14.8788 6.53578 14.8787 6.53581L14.7072 6.70738C14.3167 7.09796 13.6836 7.09804 13.293 6.70757C12.9024 6.31709 12.9023 5.68393 13.2928 5.29335L13.4644 5.12169Z" fill="currentColor"></path>

            <div class="page-layout">

                    <div class="actions-grid">

                            <svg viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"></path><path d="M7 11l5 5l5 -5"></path><path d="M12 4l0 12"></path></svg>

                            <svg viewBox="0 0 24 24"><path d="M8 8m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"></path><path d="M16 8v-2a2 2 0 0 0 -2 -2h-8a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h2"></path></svg>
                            <span>Copy SVG</span>

                            <svg viewBox="0 0 24 24"><path d="M9 15l6 -6"></path><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464"></path><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"></path></svg>

    <div class="toast-notify" id="toastNotify">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg>
        <span id="toastText">Copied!</span>
    </div>

    <script>
        var iconData = {"name":"Showtime","hex":"B10000","categories":["Software","Platform"],"variants":{"default":"/icons/showtime/default.svg","brand":"/icons/showtime/brand.svg","black":"/icons/showtime/black.svg","white":"/icons/showtime/white.svg"},"url":"https://commons.wikimedia.org/wiki/File:Showtime.svg","collection":"brands"};
        var selectedVariant = 'default';
        var selectedFormat = 'svg';
        var selectedSize = 64;
        var variantKeys = ['default', 'brand', 'black', 'white'];
        var downloadBase = 'showtime';

        var previewEl = document.getElementById('previewCanvas');
        var svgCodeEl = document.getElementById('svgCodeContainer');
        var toastEl = document.getElementById('toastNotify');
        var toastTextEl = document.getElementById('toastText');
        var toastTimeout = null;
        var colorPicker = document.getElementById('colorPicker');
        var colorHexInput = document.getElementById('colorHexInput');
        var customSizeInput = document.getElementById('customSizeInput');

        function getVariantPath(vKey) {
            return iconData.variants[vKey] || iconData.variants.default;
        }

        function cleanSvg(svgText) {
            if (!svgText) return '';
            var x = String.fromCharCode(47);
            var endTag = '<' + x + 'script>';
            var re1 = new RegExp('<!-- Code injected by live-server -->[\\s\\S]*?' + endTag, 'gi');
            var re2 = new RegExp('<script\\b[^<]*(?:(?!' + endTag + ')<[^<]*)*' + endTag, 'gi');
            return svgText.replace(re1, '').replace(re2, '').trim();
        }

        function applyColorToSvg(svgText, color) {
            if (!color || color === 'none') return svgText;
            var hex = color;
            if (hex.startsWith('#')) hex = hex.substring(1);
            return svgText.replace(/fill="currentColor"/gi, 'fill="#' + hex + '"')
                .replace(/stroke="currentColor"/gi, 'stroke="#' + hex + '"')
                .replace(/fill="([^"]*)"/gi, function(m, f) {
                    if (f === 'none' || f.startsWith('#')) return m;
                    return 'fill="#' + hex + '"';
                })
                .replace(/stroke="([^"]*)"/gi, function(m, f) {
                    if (f === 'none' || f.startsWith('#')) return m;
                    return 'stroke="#' + hex + '"';
                });
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                return new Promise(function (resolve, reject) {
                    try {
                        var ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.focus();
                        ta.select();
                        var ok = document.execCommand('copy');
                        document.body.removeChild(ta);
                        if (ok) resolve(); else reject(new Error('copy failed'));
                    } catch (e) { reject(e); }
                });
            }
        }

        function showToast(msg) {
            toastTextEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function () { toastEl.classList.remove('show'); }, 2500);
        }

        function fetchSvg(path) {
            return fetch(path).then(function (r) {
                if (!r.ok) throw new Error('fetch failed');
                return r.text();
            }).then(function (t) { return cleanSvg(t); });
        }

        function updatePreview() {
            var activePath = getVariantPath(selectedVariant);
            variantKeys.forEach(function (k) {
                var img = previewEl.querySelector('[data-variant-img="' + k + '"]');
                if (img) img.classList.toggle('active', k === selectedVariant);
            });
            fetchSvgCode(activePath);
        }

        function positionSlider(btn) {
            var ind = document.getElementById('variantSliderIndicator');
            ind.style.width = btn.offsetWidth + 'px';
            ind.style.transform = 'translateX(' + (btn.offsetLeft - 3) + 'px)';
        }

        function fetchSvgCode(variantPath) {
            svgCodeEl.textContent = 'Loading...';
            fetch(variantPath).then(function (r) {
                if (!r.ok) throw new Error();
                return r.text();
            }).then(function (txt) {
                svgCodeEl.textContent = cleanSvg(txt);
            }).catch(function () {
                svgCodeEl.textContent = '<!-- SVG source unavailable -->\n<svg src="' + variantPath + '"></svg>';
            });
        }

        function getNameVariants(name) {
            return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'icon';
        }

        function triggerDownload(filename, blob) {
            var url = window.URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function svgToCanvas(svgText, size, format) {
            return new Promise(function (resolve, reject) {
                var canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                var ctx = canvas.getContext('2d');
                var img = new Image();
                var blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
                var url = window.URL.createObjectURL(blob);
                img.onload = function () {
                    ctx.clearRect(0, 0, size, size);
                    var s = Math.min(size / img.width, size / img.height) * 0.8;
                    var w = img.width * s;
                    var h = img.height * s;
                    ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
                    window.URL.revokeObjectURL(url);
                    if (format === 'png') {
                        canvas.toBlob(function (b) { resolve(b); }, 'image/png');
                    } else {
                        canvas.toBlob(function (b) { resolve(b); }, 'image/webp', 0.92);
                    }
                };
                img.onerror = function () { reject(new Error('Image load failed')); };
                img.src = url;
            });
        }

        // ── Variant picker ──
        var picker = document.getElementById('variantPicker');
        picker.querySelectorAll('.variant-btn:not(.disabled)').forEach(function (btn) {
            btn.addEventListener('click', function () {
                selectedVariant = btn.dataset.variant;
                picker.querySelectorAll('.variant-btn').forEach(function (b) {
                    b.classList.toggle('active', b.dataset.variant === selectedVariant);
                });
                positionSlider(btn);
                updatePreview();
            });
        });
        var activeBtn = picker.querySelector('.variant-btn.active');
        if (activeBtn) positionSlider(activeBtn);

        // ── Background toggles ──
        document.getElementById('btnLightBg').addEventListener('click', function () {
            previewEl.style.backgroundColor = '#ffffff';
            previewEl.style.backgroundImage = 'none';
        });
        document.getElementById('btnGridBg').addEventListener('click', function () {
            previewEl.style.backgroundColor = '';
            previewEl.style.backgroundImage = '';
        });
        document.getElementById('btnDarkBg').addEventListener('click', function () {
            previewEl.style.backgroundColor = '#0e0e10';
            previewEl.style.backgroundImage = 'none';
        });

        // ── Color picker ──
        colorPicker.addEventListener('input', function () { colorHexInput.value = this.value; });
        colorHexInput.addEventListener('input', function () {
            var v = this.value.trim();
            if (/^#[0-9a-f]{6}$/i.test(v)) colorPicker.value = v;
        });

        function applyCustomColor() {
            var color = colorHexInput.value.trim();
            if (!/^#[0-9a-f]{6}$/i.test(color)) { showToast('Invalid hex color'); return; }
            var path = getVariantPath(selectedVariant);
            fetchSvg(path).then(function (svg) {
                var recolored = applyColorToSvg(svg, color);
                svgCodeEl.textContent = recolored;
                // Update the active preview image using a blob URL
                var blob = new Blob([recolored], { type: 'image/svg+xml;charset=utf-8' });
                var url = window.URL.createObjectURL(blob);
                variantKeys.forEach(function (k) {
                    var img = previewEl.querySelector('[data-variant-img="' + k + '"]');
                    if (k === selectedVariant) {
                        img.src = url;
                        img.classList.add('active');
                    }
                });
                showToast('Color applied to ' + selectedVariant);
            }).catch(function () { showToast('Failed to apply color'); });
        }

        document.getElementById('btnApplyColor').addEventListener('click', applyCustomColor);
        colorHexInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') applyCustomColor(); });

        // ── Size presets ──
        document.querySelectorAll('.size-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.size-btn').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                selectedSize = parseInt(btn.dataset.size, 10);
                customSizeInput.value = '';
            });
        });
        customSizeInput.addEventListener('change', function () {
            var v = parseInt(this.value, 10);
            if (v && v >= 16 && v <= 4096) {
                selectedSize = v;
                document.querySelectorAll('.size-btn').forEach(function (b) { b.classList.remove('active'); });
            }
        });

        // ── Format selector ──
        document.querySelectorAll('.format-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.format-btn').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                selectedFormat = btn.dataset.format;
                var label = 'Download ' + selectedFormat.toUpperCase();
                document.getElementById('downloadBtnLabel').textContent = label;
            });
        });

        // ── Copy Page URL ──
        var copyUrlBtn = document.getElementById('copyPageUrlBtn');
        if (copyUrlBtn) {
            copyUrlBtn.addEventListener('click', function () {
                var url = window.location.href;
                copyToClipboard(url).then(function () {
                    var linkIcon = copyUrlBtn.querySelector('.link-icon');
                    var checkIcon = copyUrlBtn.querySelector('.check-icon');
                    if (linkIcon && checkIcon) {
                        linkIcon.style.display = 'none';
                        checkIcon.style.display = 'block';
                        checkIcon.style.transform = 'scale(0.5)';
                        checkIcon.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        setTimeout(function () { checkIcon.style.transform = 'scale(1)'; }, 10);
                        setTimeout(function () {
                            checkIcon.style.transform = 'scale(0.5)';
                            setTimeout(function () {
                                checkIcon.style.display = 'none';
                                linkIcon.style.display = 'block';
                            }, 200);
                        }, 1200);
                    }
                    showToast('Page URL copied!');
                }).catch(function () { showToast('Failed to copy URL'); });
            });
        }

        // ── Download (single) ──
        document.getElementById('btnDownload').addEventListener('click', function () {
            var path = getVariantPath(selectedVariant);
            var fname = getNameVariants(downloadBase) + '-' + selectedVariant + '.' + selectedFormat;

            if (selectedFormat === 'svg') {
                fetchSvg(path).then(function (svg) {
                    var color = colorHexInput.value.trim();
                    if (/^#[0-9a-f]{6}$/i.test(color)) svg = applyColorToSvg(svg, color);
                    var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
                    triggerDownload(fname, blob);
                    showToast('Downloaded ' + fname);
                }).catch(function () { showToast('Download failed'); });
            } else {
                fetchSvg(path).then(function (svg) {
                    var color = colorHexInput.value.trim();
                    if (/^#[0-9a-f]{6}$/i.test(color)) svg = applyColorToSvg(svg, color);
                    return svgToCanvas(svg, selectedSize, selectedFormat).then(function (blob) {
                        triggerDownload(fname, blob);
                        showToast('Downloaded ' + fname);
                    });
                }).catch(function () { showToast('Download failed'); });
            }
        });

        // ── Copy SVG Code ──
        document.getElementById('btnCopySvg').addEventListener('click', function () {
            var code = svgCodeEl.textContent;
            if (!code || code.startsWith('Loading') || code.startsWith('<!-- SVG source unavailable')) {
                var path = getVariantPath(selectedVariant);
                fetchSvg(path).then(function (svg) { return copyToClipboard(svg); })
                    .then(function () { showToast('Copied SVG code!'); })
                    .catch(function () { showToast('Failed to copy'); });
                return;
            }
            copyToClipboard(code).then(function () { showToast('Copied SVG code!'); })
                .catch(function () { showToast('Failed to copy'); });
        });

        // ── Copy Path ──
        document.getElementById('btnCopyPath').addEventListener('click', function () {
            var p = getVariantPath(selectedVariant);
            copyToClipboard(p).then(function () { showToast('Copied path'); })
                .catch(function () { showToast('Failed to copy path'); });
        });

        // ── Download All ──
        document.getElementById('btnDownloadAll').addEventListener('click', function () {
            var color = colorHexInput.value.trim();
            var validColor = /^#[0-9a-f]{6}$/i.test(color);
            var done = 0;
            var failed = 0;
            var total = 0;

            variantKeys.forEach(function (k) {
                var path = iconData.variants[k];
                if (!path) return;
                total++;
                fetchSvg(path).then(function (svg) {
                    if (validColor) svg = applyColorToSvg(svg, color);
                    var fname = getNameVariants(downloadBase) + '-' + k + '.svg';
                    var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
                    triggerDownload(fname, blob);
                    done++;
                    if (done + failed === total) {
                        showToast('Downloaded ' + done + ' of ' + total + ' variants');
                    }
                }).catch(function () {
                    failed++;
                    if (done + failed === total) {
                        showToast('Downloaded ' + done + ' of ' + total + ' variants');
                    }
                });
            });

            if (total === 0) showToast('No variants available');
        });

        // ── Init ──
        fetchSvgCode(getVariantPath('default'));
    </script>
